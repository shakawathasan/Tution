<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShikhoTuition BD - Tuition & Coaching Management</title>
    <meta name="description" content="Tuition and coaching management web app for Bangladesh with Fees Pending, Attendance, Weekly Test Reports, Parent App, Owner Dashboard, bKash payments, and WhatsApp messaging." />
    <meta property="og:title" content="ShikhoTuition BD - Tuition & Coaching Management" />
    <meta property="og:description" content="Tuition and coaching management web app for Bangladesh with Fees Pending, Attendance, Weekly Test Reports, Parent App, Owner Dashboard, bKash payments, and WhatsApp messaging." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans">
    <!-- Top Navigation Bar following the Top Bar Contract -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between gap-6 h-14">
          <!-- Zone 1: Single Brand Wordmark -->
          <div class="flex items-center gap-3 shrink-0">
            <button id="mobile-menu-toggle" class="md:hidden p-1.5 text-slate-500 hover:text-slate-800 rounded-lg">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <a href="#" class="text-base font-bold tracking-tight text-blue-900 whitespace-nowrap flex items-center gap-1.5">
              <svg class="w-5 h-5 text-blue-700" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3z M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
              <span>ShikhoTuition BD</span>
            </a>
          </div>

          <!-- Zone 2: Primary Nav Links -->
          <nav class="hidden md:flex items-center gap-6 h-full overflow-x-auto">
            <a href="#fees" class="nav-link text-xs font-semibold text-blue-700 border-b-2 border-blue-700 py-4 px-1 whitespace-nowrap" data-view="fees">
              Fees Pending
            </a>
            <a href="#attendance" class="nav-link text-xs font-medium text-slate-600 hover:text-slate-900 border-b-2 border-transparent py-4 px-1 whitespace-nowrap transition-colors" data-view="attendance">
              Attendance
            </a>
            <a href="#tests" class="nav-link text-xs font-medium text-slate-600 hover:text-slate-900 border-b-2 border-transparent py-4 px-1 whitespace-nowrap transition-colors" data-view="tests">
              Weekly Tests
            </a>
            <a href="#parent" class="nav-link text-xs font-medium text-slate-600 hover:text-slate-900 border-b-2 border-transparent py-4 px-1 whitespace-nowrap transition-colors" data-view="parent">
              Parent Portal
            </a>
            <a href="#owner" class="nav-link text-xs font-medium text-slate-600 hover:text-slate-900 border-b-2 border-transparent py-4 px-1 whitespace-nowrap transition-colors" data-view="owner">
              Owner Analytics
            </a>
            <a href="#admin" class="nav-link text-xs font-medium text-slate-600 hover:text-slate-900 border-b-2 border-transparent py-4 px-1 whitespace-nowrap transition-colors" data-view="admin">
              Admin Panel
            </a>
          </nav>

          <!-- Zone 3: Active Profile & Demo Switcher -->
          <div class="flex items-center gap-3 shrink-0">
            <div class="hidden sm:flex flex-col text-right">
              <span id="user-name-label" class="text-xs font-bold text-slate-900 leading-tight">Admin Director</span>
              <span id="user-role-label" class="text-[10px] font-mono text-blue-700">ADMIN</span>
            </div>
            <select id="role-switcher-select" class="text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-lg px-2.5 py-1.5 font-medium text-slate-800 focus:outline-none cursor-pointer">
              <option value="user-admin">Role: Admin / Owner</option>
              <option value="user-teacher">Role: Senior Teacher</option>
              <option value="user-parent-1">Role: Parent (Abdul Karim - 2 Children)</option>
              <option value="user-parent-2">Role: Parent (Begum Nasrin - Fahim)</option>
            </select>
          </div>
        </div>
      </div>
    </header>

    <!-- Mobile Drawer -->
    <div id="mobile-menu-drawer" class="hidden md:hidden bg-white border-b border-slate-200 px-4 py-3 space-y-2">
      <a href="#fees" class="mobile-drawer-link block py-2 text-xs font-semibold text-slate-700" data-view="fees">Fees Pending & Collection</a>
      <a href="#attendance" class="mobile-drawer-link block py-2 text-xs font-semibold text-slate-700" data-view="attendance">Attendance Register</a>
      <a href="#tests" class="mobile-drawer-link block py-2 text-xs font-semibold text-slate-700" data-view="tests">Weekly Test Reports</a>
      <a href="#parent" class="mobile-drawer-link block py-2 text-xs font-semibold text-slate-700" data-view="parent">Parent Portal (bKash)</a>
      <a href="#owner" class="mobile-drawer-link block py-2 text-xs font-semibold text-slate-700" data-view="owner">Owner Business Analytics</a>
      <a href="#admin" class="mobile-drawer-link block py-2 text-xs font-semibold text-slate-700" data-view="admin">Full Admin Panel</a>
    </div>

    <!-- Main Content Viewport -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 pb-20 md:pb-8">
      <div id="view-fees" class="app-view"></div>
      <div id="view-attendance" class="app-view hidden"></div>
      <div id="view-tests" class="app-view hidden"></div>
      <div id="view-parent" class="app-view hidden"></div>
      <div id="view-owner" class="app-view hidden"></div>
      <div id="view-admin" class="app-view hidden"></div>
    </main>

    <!-- Mobile Bottom Quick Navigation Bar -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-30 flex items-center justify-around py-2 shadow-lg">
      <button class="mobile-nav-btn flex flex-col items-center text-blue-700 font-bold" data-view="fees">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span class="text-[10px] mt-0.5">Fees</span>
      </button>
      <button class="mobile-nav-btn flex flex-col items-center text-slate-500" data-view="attendance">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
        <span class="text-[10px] mt-0.5">Attendance</span>
      </button>
      <button class="mobile-nav-btn flex flex-col items-center text-slate-500" data-view="tests">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        <span class="text-[10px] mt-0.5">Tests</span>
      </button>
      <button class="mobile-nav-btn flex flex-col items-center text-slate-500" data-view="parent">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-[10px] mt-0.5">Parent</span>
      </button>
      <button class="mobile-nav-btn flex flex-col items-center text-slate-500" data-view="admin">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/></svg>
        <span class="text-[10px] mt-0.5">Admin</span>
      </button>
    </div>

    <!-- Toast Notification Anchor -->
    <div id="toast-container"></div>

    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>
